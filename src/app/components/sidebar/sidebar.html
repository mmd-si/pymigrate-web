<aside class="h-full flex flex-col gap-4 w-72 text-white bg-app-navy-900">
    <div class="p-2">
        <a routerLink="/branches" class="block w-full p-4 hover:bg-app-navy-700 rounded-lg duration-150">
            <app-logo></app-logo>
        </a>
    </div>
    <nav class="flex-1 flex flex-col p-2 space-y-2">
        <h2 class="text-app-navy-300 text-sm uppercase font-semibold">Menú</h2>
        <ul class="space-y-1">
            <li class="w-full px-4 py-2 rounded-lg hover:bg-app-navy-700 has-[.active]:bg-app-yellow-300/20 text-app-navy-200 has-[.active]:text-yellow-400 has-[.active]:font-semibold hover:text-white duration-150">
                <a
                    routerLink="/branches"
                    routerLinkActive="active"
                    class="block"
                >Sucursales</a>
            </li>
            <li class="w-full px-4 py-2 rounded-lg hover:bg-app-navy-700 has-[.active]:bg-app-yellow-300/20 text-app-navy-200 has-[.active]:text-yellow-400 has-[.active]:font-semibold hover:text-white duration-150">
                <a
                    routerLink="/transfers"
                    routerLinkActive="active"
                    class="block"
                >Transferencias</a>
            </li>
        </ul>
    </nav>
    @if (authService.session(); as session) {
        <app-account-info [session]="session"></app-account-info>
    }
</aside>
