<td class="p-3 group-last:first:rounded-bl-lg group-last:last:rounded-br-lg">
    <label [for]="item().barcode" class="group flex gap-2 items-center cursor-pointer">
        <div
            class="size-5 flex justify-center items-center border border-app-field-border group-has-checked:border-app-indigo-600 group-has-checked:bg-app-indigo-600 duration-150 rounded bg-white">
            <svg [size]="16" color="white" lucideCheck
                class="scale-0 group-has-checked:scale-100 duration-150"></svg>
        </div>
        <input type="checkbox" name="selection" [id]="item().barcode" class="hidden" [checked]="checked()"
            (change)="toggle.emit()">
    </label>
</td>
<td class="p-3 group-last:first:rounded-bl-lg group-last:last:rounded-br-lg">
    <button type="button" class="font-mono text-app-indigo-600 font-medium" (click)="openDetails.emit()">
        {{ item().barcode! }}
    </button>
</td>
<td class="p-3 group-last:first:rounded-bl-lg group-last:last:rounded-br-lg">
    @if (item().description) {
    <p class="line-clamp-1">{{ item().description }}</p>
    } @else {
    <p class="line-clamp-1 italic text-app-text-muted">Vacía</p>
    }
</td>
<td class="p-3 group-last:first:rounded-bl-lg group-last:last:rounded-br-lg">
    <p class="line-clamp-1">{{ item().caratRating }}</p>
</td>
<td class="p-3 group-last:first:rounded-bl-lg group-last:last:rounded-br-lg">
    @if (item().costUSD()) {
    <p class="line-clamp-1">${{ item().costUSD()! }}</p>
    } @else {
    <p class="line-clamp-1 text-app-text-muted italic">Desconocido</p>
    }
</td>
<td class="p-3 group-last:first:rounded-bl-lg group-last:last:rounded-br-lg">
    @if (item().retailPriceUSD()) {
    <p class="line-clamp-1 font-semibold">${{ item().retailPriceUSD()! }}</p>
    } @else {
    <p class="line-clamp-1 text-app-text-muted italic">Desconocido</p>
    }
</td>
<td class="p-3 group-last:first:rounded-bl-lg group-last:last:rounded-br-lg">
    <p class="line-clamp-1">{{ item().weight }}g</p>
</td>
