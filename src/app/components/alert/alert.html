@if (alert() && visible()) {
    @let type = alert()!.type;
    @let message = alert()!.message;
    <div class="fixed top-4 right-4 z-20 flex items-center px-2 py-1 gap-4 w-max min-w-md max-w-2xl"
        [class.bg-green-900]="type === 'success'" [class.bg-red-900]="type === 'error'"
        [class.bg-yellow-900]="type === 'warning'" [class.bg-blue-900]="type === 'info'"
        [class.text-green-100]="type === 'success'" [class.text-red-100]="type === 'error'"
        [class.text-yellow-100]="type === 'warning'" [class.text-blue-100]="type === 'info'"
        animate.enter="alert-appear" animate.leave="alert-disappear">
        <div class="flex items-center gap-4 flex-1">
            @switch (type) {
                @case ("success") {
                    <svg lucideCheck [size]="18" class="text-green-400"></svg>
                }
                @case ("error") {
                    <svg lucideCircleAlert [size]="18" class="text-red-400"></svg>
                }
                @case ("warning") {
                    <svg lucideTriangleAlert [size]="18" class="text-yellow-400"></svg>
                }
                @default {
                    <svg lucideInfo [size]="18" class="text-blue-400"></svg>
                }
            }
            <p>{{ message }}</p>
        </div>
        <button type="button" class="contents" (click)="dismiss()">
            <svg lucideX [size]="18"></svg>
        </button>
    </div>
}
